# OmniPdM Mosquitto 설정 — PRD v6.3 §10 T1-01 (Docker compose 내부).
#
# 보안 경계 정책:
# - 이 broker 는 docker-compose 안에서만 동작. Docker 컨테이너 내부에서
#   listener 가 0.0.0.0 에 바인드되어야 worker (host process) 가
#   port mapping 을 통해 접속 가능 (localhost 바인드는 컨테이너 외부에서 접속 불가).
# - 따라서 "외부 노출 차단" 의 진짜 boundary 는 docker-compose 의 ports 설정.
#   현재 docker-compose.yml 은 "127.0.0.1:1883:1883" 로 host loopback 만 노출 →
#   같은 머신 process 만 접속 가능, 네트워크 외부에서는 불가.
# - 외부 노출이 필요해지면 (산학 데모 / ngrok / 클라우드 등) 그 시점에 추가:
#     allow_anonymous false
#     password_file /mosquitto/config/passwd
#     listener 8883 (TLS) + cafile/certfile/keyfile
#   현재 PoC 는 그 단계 아님.

listener 1883
allow_anonymous true

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
