# OmniPdM Tier 1 — PRD v6.3 §10 T1-03/T1-04 인프라.
#
# 서비스:
#   timescaledb : Postgres 16 + TimescaleDB extension (이력 저장 + hypertable)
#   app         : Flask + React SPA (frontend/dist 정적 서빙)
#   mosquitto   : MQTT broker (T1-01 워커가 구독하는 broker. 로컬 PoC 용)
#
# 실행:
#   docker compose up -d                    # app + DB + MQTT
#   docker compose down -v                  # 정리 (볼륨까지 삭제)
#
# 데이터 영속성:
#   timescaledb_data  : Postgres 데이터 디렉터리
#   mosquitto_data    : MQTT 메시지 (옵션)

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: omnipdm-app
    restart: unless-stopped
    depends_on:
      timescaledb:
        condition: service_healthy
      mosquitto:
        condition: service_started
    ports:
      - "127.0.0.1:8050:8050"
    environment:
      DASH_HOST: 0.0.0.0
      DASH_PORT: 8050
      DASH_DEBUG: "false"
      OMNIPDM_DB_HOST: timescaledb
      OMNIPDM_DB_PORT: 5432
      OMNIPDM_DB_NAME: omnipdm
      OMNIPDM_DB_USER: omnipdm
      OMNIPDM_DB_PASSWORD: omnipdm
      OMNIPDM_MQTT_HOST: mosquitto
      OMNIPDM_MQTT_PORT: 1883
      OMNIPDM_SECRET_KEY: ${OMNIPDM_SECRET_KEY:-dev-only-change-this-secret-key}
      OMNIPDM_AUTH_REQUIRED: ${OMNIPDM_AUTH_REQUIRED:-true}

  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: omnipdm-timescaledb
    restart: unless-stopped
    environment:
      POSTGRES_DB: omnipdm
      POSTGRES_USER: omnipdm
      # PoC 용 비밀번호. 운영 시 env 또는 secrets 로 교체.
      POSTGRES_PASSWORD: omnipdm
    ports:
      # host loopback 만 노출 — 같은 머신 process(워커) 만 접속 가능, 네트워크 외부에서는 불가.
      - "127.0.0.1:5432:5432"
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
      # initdb 스크립트: postgres 공식 entrypoint 가 알파벳순으로 실행한다.
      # 00_ : 기본 hypertable 3종 (telemetry/predictions/alerts) — T1-03.
      # 01_ : CMMS Tier 1.5 P0 (users/devices/orders/status_history/audit_log + FK + 트리거) — T1.5.
      # 새 마이그레이션 추가 시 02_, 03_ ... 로 prefix 를 늘려 이 볼륨 목록에 1줄씩 추가.
      - ./infra/timescaledb/init.sql:/docker-entrypoint-initdb.d/00_init.sql:ro
      - ./infra/timescaledb/migrations/001_cmms_schema.sql:/docker-entrypoint-initdb.d/01_cmms_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omnipdm -d omnipdm"]
      interval: 10s
      timeout: 5s
      retries: 5

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: omnipdm-mosquitto
    restart: unless-stopped
    ports:
      # host loopback only — 같은 머신 worker/시뮬레이터만 접속 가능.
      # 외부 노출 필요 시 mosquitto.conf 에 TLS+auth 추가 후 0.0.0.0 으로 변경.
      - "127.0.0.1:1883:1883"
    volumes:
      - ./infra/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log

volumes:
  timescaledb_data:
  mosquitto_data:
  mosquitto_log:
